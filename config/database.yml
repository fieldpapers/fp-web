# Development and test connect via libpq, which reads the standard PGHOST,
# PGPORT, PGUSER, and PGPASSWORD environment variables (and defaults to the
# local Unix socket as the current user).
#
# DATABASE_URL, if set, overrides this file for whichever environment is
# running, including test, so tests would run against that database.

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("MAX_THREADS", 5) %>

development:
  <<: *default
  database: fieldpapers_development

# Warning: this database is erased and re-created from db/schema.rb by the
# test runner. Do not point it at the development or production database.
test:
  <<: *default
  database: fieldpapers_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
